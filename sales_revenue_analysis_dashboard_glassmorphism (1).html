<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales & Revenue Analysis Dashboard</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  min-height:100vh;
  padding:40px;
  background:linear-gradient(135deg,#dff6ff,#ccecff,#eef9ff);
  color:#0f172a;
}

h1{
  text-align:center;
  margin-bottom:30px;
  font-size:38px;
  color:#083344;
  font-weight:700;
}

.glass{
  background:rgba(255,255,255,0.18);
  border-radius:24px;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.35);
  box-shadow:0 8px 32px rgba(31,38,135,0.15);
}

.upload-section{
  padding:30px;
  text-align:center;
  margin-bottom:30px;
}

.upload-section input{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#ffffffbb;
  cursor:pointer;
}

.upload-section p{
  margin-top:10px;
  color:#334155;
}

.kpi-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
  margin-bottom:35px;
}

.kpi-card{
  padding:25px;
  text-align:center;
}

.kpi-card h2{
  margin-bottom:10px;
  color:#155e75;
  font-size:18px;
}

.kpi-card p{
  font-size:30px;
  font-weight:bold;
}

.chart-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(650px,1fr));
  gap:35px;
}

.chart-box{
  padding:40px;
}

.chart{
  width:100%;
  height:450px;
}

@media(max-width:900px){

  .chart-grid{
    grid-template-columns:1fr;
  }

  body{
    padding:20px;
  }

}

</style>
</head>

<body>

<h1>Sales & Revenue Analysis Dashboard</h1>

<div class="upload-section glass">
  <input type="file" id="fileInput" accept=".json">
  <p>Upload your local JSON sales dataset</p>
</div>

<div class="kpi-container">

  <div class="kpi-card glass">
    <h2>Total Sales</h2>
    <p id="totalSales">$0</p>
  </div>

  <div class="kpi-card glass">
    <h2>Total Profit</h2>
    <p id="totalProfit">$0</p>
  </div>

  <div class="kpi-card glass">
    <h2>Total Orders</h2>
    <p id="totalOrders">0</p>
  </div>

  <div class="kpi-card glass">
    <h2>Profit Margin</h2>
    <p id="profitMargin">0%</p>
  </div>

</div>

<div class="chart-grid">

  <div class="chart-box glass">
    <div id="monthlySalesChart" class="chart"></div>
  </div>

  <div class="chart-box glass">
    <div id="categoryChart" class="chart"></div>
  </div>

  <div class="chart-box glass">
    <div id="segmentChart" class="chart"></div>
  </div>

  <div class="chart-box glass">
    <div id="countryChart" class="chart"></div>
  </div>

  <div class="chart-box glass">
    <div id="shippingChart" class="chart"></div>
  </div>

</div>

<script>

document.getElementById("fileInput").addEventListener("change", function(event){

  const file = event.target.files[0];

  if(!file){
    alert("Please upload a JSON file.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    try{

      const data = JSON.parse(e.target.result);

      if(!Array.isArray(data)){
        alert("JSON must be an array of objects.");
        return;
      }

      generateDashboard(data);

    }catch(error){
      alert("Invalid JSON File");
      console.error(error);
    }

  };

  reader.readAsText(file);

});

function layoutTemplate(title){

  return {
    title:{
      text:title,
      font:{
        size:22,
        color:"#083344"
      }
    },
    paper_bgcolor:'rgba(0,0,0,0)',
    plot_bgcolor:'rgba(255,255,255,0.05)',
    margin:{
      l:160,
      r:160,
      t:70,
      b:70
    },
    font:{
      color:"#0f172a"
    }
  };

}

function generateDashboard(data){

  const totalSales = data.reduce((sum,row)=>sum + Number(row.Sales || 0),0);

  const totalProfit = data.reduce((sum,row)=>sum + Number(row.Profit || 0),0);

  const totalOrders = data.length;

  const profitMargin = ((totalProfit / totalSales) * 100).toFixed(2);

  document.getElementById("totalSales").innerText =
    "$" + totalSales.toLocaleString();

  document.getElementById("totalProfit").innerText =
    "$" + totalProfit.toLocaleString();

  document.getElementById("totalOrders").innerText =
    totalOrders;

  document.getElementById("profitMargin").innerText =
    profitMargin + "%";

  const monthlySales = {};

  data.forEach(row => {

    const date = row["Order Date"];

    if(date){

      const parts = date.split("-");

      const monthYear = parts[1] + "-" + parts[2];

      monthlySales[monthYear] =
        (monthlySales[monthYear] || 0) + Number(row.Sales);

    }

  });

  Plotly.newPlot("monthlySalesChart",[{
    x:Object.keys(monthlySales),
    y:Object.values(monthlySales),
    type:"scatter",
    mode:"lines+markers",
    fill:"tozeroy"
  }], layoutTemplate("Monthly Sales Trend"));

  const categorySales = {};

  data.forEach(row => {

    categorySales[row.Category] =
      (categorySales[row.Category] || 0) + Number(row.Sales);

  });

  Plotly.newPlot("categoryChart",[{
    x:Object.keys(categorySales),
    y:Object.values(categorySales),
    type:"bar"
  }], layoutTemplate("Sales by Category"));

  const segmentSales = {};

  data.forEach(row => {

    segmentSales[row.Segment] =
      (segmentSales[row.Segment] || 0) + Number(row.Sales);

  });

  Plotly.newPlot("segmentChart",[{
    labels:Object.keys(segmentSales),
    values:Object.values(segmentSales),
    type:"pie",
    hole:0.45
  }], layoutTemplate("Customer Segment Analysis"));

  const countrySales = {};

  data.forEach(row => {

    countrySales[row.Country] =
      (countrySales[row.Country] || 0) + Number(row.Sales);

  });

  Plotly.newPlot("countryChart",[{
    x:Object.keys(countrySales),
    y:Object.values(countrySales),
    type:"bar"
  }], layoutTemplate("Sales by Country"));

  const shippingSales = {};

  data.forEach(row => {

    shippingSales[row["Ship Mode"]] =
      (shippingSales[row["Ship Mode"]] || 0) + Number(row.Sales);

  });

  Plotly.newPlot("shippingChart",[{
    labels:Object.keys(shippingSales),
    values:Object.values(shippingSales),
    type:"pie"
  }], layoutTemplate("Sales by Shipping Mode"));

}

</script>

</body>
</html>
